<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h1>To-Do List</h1>

        <!-- Progress Tracker Bar -->
        <div class="progress-container">
            <div class="progress-text">Progress: <span id="progress-percent">0%</span></div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Input Area (With fixed input bracket) -->
        <div class="todo-input-area">
            <form id="todo-form" style="display: flex; width: 100%; gap: 10px;">
                <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required>
                <button type="submit" id="add-btn">Add</button>
            </form>
        </div>

        <!-- Filter and Action Controls -->
        <div class="todo-controls">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clear-all-btn">Clear Completed</button>
        </div>

        <!-- Dynamic List -->
        <ul id="todo-list">
            <!-- Tasks will be added here dynamically via JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
